version: "3.9"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: travel-sql
    environment:
      SA_PASSWORD: "SqlS3rver@2026!"
      ACCEPT_EULA: "Y"
    volumes:
      - sql_data:/var/opt/mssql
    networks:
      - travel-net
    healthcheck:
      test: [
        "CMD-SHELL",
        "/opt/mssql-tools/bin/sqlcmd -S 127.0.0.1 -U sa -P SqlS3rver@2026! -Q \"SELECT 1\" || exit 1"
      ]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 40s

  web:
    image: abdulmoiz1122/travel-app:latest
    container_name: travel-app
    depends_on:
      sqlserver:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=TravelDB;User Id=sa;Password=SqlS3rver@2026!;TrustServerCertificate=True;"
    networks:
      - travel-net
    restart: always

networks:
  travel-net:

volumes:
  sql_data:
